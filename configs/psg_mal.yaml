### model
model_name_or_path: models/Qwen2.5-7B-Instruct
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target: all

### dataset
dataset: agesafer_mal_psg
template: qwen
cutoff_len: 3072
max_samples: 1000000
overwrite_cache: true
preprocessing_num_workers: 8

### output
output_dir: outputs/mal/psg_adapter
logging_steps: 20
save_steps: 500
plot_loss: true
overwrite_output_dir: false
save_total_limit: 3

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 0.0001
num_train_epochs: 2.0
lr_scheduler_type: cosine
warmup_ratio: 0.03
bf16: true
ddp_timeout: 180000000
gradient_checkpointing: true

### eval
val_size: 0.02
per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 500

seed: 42
data_seed: 42
report_to: none
